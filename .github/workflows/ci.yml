# CI：ruff 静态检查 + pytest 测试矩阵（W3-A4）。
#
# 矩阵设计（3 个组合）：
#   - 3.11 / ubuntu-latest ：支持的下限 Python 版本；
#   - 3.13 / ubuntu-latest ：主开发版本，唯一启用覆盖率统计的条目（避免整套测试重复跑 3 次）；
#   - 3.13 / windows-latest ：沙箱执行器（audit/sandbox/executor.py）的 win32 分支
#     依赖 sys.platform 守卫、测试均用 sys.executable/tmp_path，理论上跨平台；
#     此条目用于实证 Windows 兼容性（仅跑测试，不带 lint/覆盖率）。
# fail-fast=false：某个平台首跑失败时不取消其他平台，便于对照定位平台差异。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read   # W15-C 权限收减：删除对 issues 的写权限——全 workflow 无任何 issues 操作
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            os: ubuntu-latest
            with-cov: 'false'  # 覆盖率只在主版本条目统计一次
          - python-version: "3.13"
            os: ubuntu-latest
            with-cov: 'true'
          - python-version: "3.13"
            os: windows-latest
            with-cov: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip    # 缓存 pip 下载，加速依赖安装

      - name: Install package with dev dependencies
        # 以可编辑模式安装本项目及 dev 依赖（pytest / pytest-asyncio）
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        # 只在 3.13/ubuntu 条目执行一次：lint 结果与解释器版本、操作系统无关，
        # 无需在矩阵每个条目重复。ruff 不在项目依赖中，此处按本地验证版本安装。
        if: matrix.with-cov == 'true'
        run: |
          pip install "ruff==0.12.*"
          ruff check .

      # W15-C：依赖已知漏洞审计（pip-audit 官方 PyPA 漏洞扫描，与 Dependabot 互为兜底）。
      # continue-on-error: false 为显式声明——发现已知 CVE 即失败，不静默放过。
      # --strict：审计器自身异常（如依赖无法映射到 PyPI）同样按失败处理。
      # 注意命令名是带连字符的 pip-audit（pip-audit 包的 console script，
      # pip 本身没有 audit 子命令，`pip audit` 会报 unknown command——已实测）。
      - name: Dependency audit (pip-audit)
        if: matrix.with-cov == 'true'
        continue-on-error: false
        run: |
          pip install pip-audit
          pip-audit --strict

      - name: Install pytest-cov (coverage entry only)
        if: matrix.with-cov == 'true'
        run: pip install pytest-cov

      - name: Run tests
        # 常规条目：安静模式 + 短回溯，失败时输出可读；tee 落盘供失败上传
        if: matrix.with-cov != 'true'
        run: pytest -q --tb=short

      - name: Run tests with coverage (py3.13 / ubuntu)
        # 覆盖率条目：仅统计 audit 包，输出终端报表。
        # W15-C 棘轮基线：2026-09-15 实测 87%，--cov-fail-under=85（向下取到 5 的倍数），只升不降；
        # 提升覆盖率后须同步上调该值（并同步 tests/unit/ci/test_ci_config.py 的 COV_FAIL_UNDER）。
        if: matrix.with-cov == 'true'
        run: pytest -q --tb=short --cov=audit --cov-report=term --cov-fail-under=85

  # W8：前端（frontend/，React + Vite）质量门禁——类型检查、单测、构建三关。
  # 与 Python 矩阵相互独立；npm 缓存按 package-lock.json 哈希。
  frontend:
    name: frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests (vitest run)
        working-directory: frontend
        run: npm run test

      - name: Build (tsc + vite build)
        working-directory: frontend
        run: npm run build
